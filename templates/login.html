{{define "content"}}
<div class="narrow-page">
<h1>Sign in</h1>
<p>Enter your email and we'll send you a sign-in link. No password needed.</p>
<form method="post" action="/login" class="stack">
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <input type="email" name="email" required autocomplete="email" inputmode="email" placeholder="you@example.com" autofocus>
  <button class="primary big">Email me a link</button>
</form>
</div>
{{end}}
